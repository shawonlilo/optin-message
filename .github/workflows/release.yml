name: Release

# v0.7.0 "Simple App" factory: push a version tag (v0.7.0) and this
# builds installers for Windows, macOS and Linux, plus an Android APK.
# The app is a plain Tauri 2 shell around a static frontend
# (app/ui: index.html + app.js + logo.png) — the whole product runs
# on-device in the webview with local storage. There is NO engine,
# NO sidecar, NO Python in the app build: nothing to freeze, stage
# or spawn. The Python server edition still lives at the repo root
# as an optional developer edition; its tests run in the gate job
# for information only and never block the app release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Without this, GITHUB_TOKEN is read-only in this repo and every release
# create/upload from CI fails with 403 "Resource not accessible by
# integration" (the v0.2.0–v0.2.2 saga on the sibling repos).
permissions:
  contents: write

jobs:
  quality-gates:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: App JS syntax gate (the Simple App is app/ui/app.js)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check app/ui/app.js
      - name: Static smoke — UI files exist, no server calls in the app
        run: |
          test -f app/ui/index.html && test -f app/ui/app.js && test -f app/ui/logo.png
          if grep -nE "fetch\(|XMLHttpRequest|WebSocket|localhost|127\.0\.0\.1" app/ui/app.js app/ui/index.html ; then
            echo "::error::the Simple App must not call any server"
            exit 1
          fi
          echo "static smoke clean"
      - name: Credential grep (hard gate — no keys, tokens or private keys in the tree)
        run: |
          if grep -RInE --exclude-dir=.git --exclude-dir=data --exclude-dir=target \
              "(AKIA[0-9A-Z]{16}|ghp_[0-9A-Za-z]{36}|github_pat_[0-9A-Za-z_]{40,}|sk-[0-9A-Za-z]{32,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|xox[baprs]-[0-9A-Za-z-]{10,})" . ; then
            echo "::error::credential pattern found — release blocked"
            exit 1
          fi
          echo "credential grep clean"
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Optional developer (Python server) edition: tests are
      # informational only — a red run here never blocks the app.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python server-edition tests (non-blocking)
        continue-on-error: true
        run: python3 tests/test_e2e.py

  desktop:
    needs: quality-gates
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
          - os: macos-latest
            args: "--target x86_64-apple-darwin"
          - os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system packages
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Build app + installers
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "Opt-In Message ${{ github.ref_name }}"
          # Keep this body version-neutral: it ships with every tag, so
          # anything version-specific belongs in the release notes the
          # maintainer adds after the assets land, not in here.
          releaseBody: "See the assets below to download and install this version. This is the Simple App: download, install, open — it just works. No Python, no server, no setup, no account; the whole app runs on your device and your data stays on your device. Sending is simulated in this edition (delivery log only, no real messages). The Android APK (optin-message-android.apk, arm64) is signed with an ephemeral CI key, so Android will ask you to allow the install (sideload); the full app runs on Android too — it is the same on-device app, not a viewer. Prefer not to install anything? Try the live sandbox: https://optin-message.shawonshovon687.workers.dev"
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Keep bundles as artifacts (safety net)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.os }}-${{ strategy.job-index }}
          path: |
            app/src-tauri/target/**/release/bundle/**/*.exe
            app/src-tauri/target/**/release/bundle/**/*.msi
            app/src-tauri/target/**/release/bundle/**/*.dmg
            app/src-tauri/target/**/release/bundle/**/*.AppImage
            app/src-tauri/target/**/release/bundle/**/*.deb
            app/src-tauri/target/**/release/bundle/**/*.app.tar.gz
          if-no-files-found: warn

  android:
    needs: quality-gates
    runs-on: ubuntu-22.04
    continue-on-error: true # beta: Android lane is experimental
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK packages + NDK (SDK is preinstalled on the runner)
        run: |
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Rust + Android targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi
          cargo install tauri-cli --version "^2" --locked
      - name: Init + build Android (release profile, arm64)
        working-directory: app/src-tauri
        run: |
          cargo tauri android init
          # Release profile (optimized + stripped) for the arm64 ABI that
          # every modern Android phone uses. A release build comes out
          # unsigned; the next step signs it so it can be sideloaded.
          # v0.7.0: the app has no sidecar/externalBin at all, so the old
          # tauri.android.conf.json override is gone — nothing to exclude.
          # Tee the full log so a failure leaves the real error behind.
          set -o pipefail
          cargo tauri android build --apk --target aarch64 2>&1 | tee /tmp/android-build.log
      - name: Surface the Android build log on failure
        if: failure()
        run: |
          echo "## Android build log (tail)" >> "$GITHUB_STEP_SUMMARY"
          tail -n 150 /tmp/android-build.log >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-build-log
          path: /tmp/android-build.log
          if-no-files-found: ignore
      - name: Sign the APK (ephemeral CI debug key) + give it a real name
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          UNSIGNED=$(find app/src-tauri/gen/android -name "*-release-unsigned.apk" | head -1)
          echo "unsigned APK: $UNSIGNED"
          keytool -genkeypair -keystore /tmp/oim.keystore -storepass android \
            -keypass android -alias oim -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Opt-In Message CI,O=Cyberspace Work,C=BD"
          "$BT/zipalign" -f 4 "$UNSIGNED" /tmp/oim-aligned.apk
          "$BT/apksigner" sign --ks /tmp/oim.keystore --ks-pass pass:android \
            --key-pass pass:android --out optin-message-android.apk /tmp/oim-aligned.apk
          "$BT/apksigner" verify --print-certs optin-message-android.apk | head -3
          ls -la optin-message-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: optin-message-android-apk
          path: optin-message-android.apk
          if-no-files-found: warn
      - name: Attach the APK to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Opt-In Message ${{ github.ref_name }}
          files: optin-message-android.apk
          fail_on_unmatched_files: false
