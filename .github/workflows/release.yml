name: Release

# Born-beta factory (same pattern as CleanReach / Network Diagnostics):
# push a version tag (v0.6.1) and this builds installers for Windows,
# macOS and Linux, plus an experimental Android APK. The desktop app is a
# Tauri 2 shell whose engine is BUILT IN: each desktop job first freezes
# the Python engine (engine_main.py) with PyInstaller into a standalone
# `optin-engine` sidecar binary, so end users need nothing installed.
# The .py sources also ship as resources as a fallback launch path.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Without this, GITHUB_TOKEN is read-only in this repo and every release
# create/upload from CI fails with 403 "Resource not accessible by
# integration" (the v0.2.0–v0.2.2 saga on the sibling repos).
permissions:
  contents: write

jobs:
  quality-gates:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python engine tests (49 checks)
        run: python3 tests/test_e2e.py
      - name: Credential grep (hard gate — no keys, tokens or private keys in the tree)
        run: |
          if grep -RInE --exclude-dir=.git --exclude-dir=data --exclude-dir=target \
              "(AKIA[0-9A-Z]{16}|ghp_[0-9A-Za-z]{36}|github_pat_[0-9A-Za-z_]{40,}|sk-[0-9A-Za-z]{32,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|xox[baprs]-[0-9A-Za-z-]{10,})" . ; then
            echo "::error::credential pattern found — release blocked"
            exit 1
          fi
          echo "credential grep clean"
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop:
    needs: quality-gates
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
            triple: x86_64-pc-windows-msvc
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
            triple: aarch64-apple-darwin
          - os: macos-latest
            args: "--target x86_64-apple-darwin"
            triple: x86_64-apple-darwin
          - os: ubuntu-22.04
            args: ""
            triple: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system packages
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Freeze the engine into the standalone sidecar the shell launches
      # first. gui/ must ride inside the frozen binary (add-data with an
      # ABSOLUTE source path — a relative one resolves against the spec
      # dir and silently breaks). Note: the macOS x86_64 job runs on an
      # arm64 runner, so its "x86_64" engine is arm64 code; the shell
      # detects a dead sidecar and falls back to system Python there.
      - name: Freeze engine sidecar (PyInstaller, macOS/Linux)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          pip install pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile \
            --name optin-engine \
            --add-data "$GITHUB_WORKSPACE/gui:gui" \
            --distpath /tmp/enginedist --workpath /tmp/enginework \
            --specpath /tmp/enginespec \
            engine_main.py
          mkdir -p app/src-tauri/binaries
          cp /tmp/enginedist/optin-engine "app/src-tauri/binaries/optin-engine-${{ matrix.triple }}"
          chmod +x "app/src-tauri/binaries/optin-engine-${{ matrix.triple }}"
          ls -la app/src-tauri/binaries/
      - name: Freeze engine sidecar (PyInstaller, Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          pip install pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile `
            --name optin-engine `
            --add-data "$env:GITHUB_WORKSPACE\gui;gui" `
            --distpath "$env:TEMP\enginedist" --workpath "$env:TEMP\enginework" `
            --specpath "$env:TEMP\enginespec" `
            engine_main.py
          New-Item -ItemType Directory -Force app/src-tauri/binaries | Out-Null
          Copy-Item "$env:TEMP\enginedist\optin-engine.exe" "app/src-tauri/binaries/optin-engine-${{ matrix.triple }}.exe"
          Get-ChildItem app/src-tauri/binaries
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Build app + installers
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "Opt-In Message ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install this version. v0.6.1: everything in v0.6.0 (the engine is BUILT IN — desktop installers carry a standalone engine binary, so no Python installation is needed; Windows also has a one-click auto-setup fallback; real logo; welcome screen with Restart engine / Open data folder / Copy dashboard URL) PLUS the Android APK (optin-message-android.apk, arm64) now builds and ships — it is signed with an ephemeral CI key, so Android will ask you to allow the install (sideload). The Android shell is a launcher/viewer: the Python engine cannot run on Android, so for the full app on mobile use the PWA from a running desktop/server instance. The plain source zip runs anywhere Python 3 runs: python3 app.py"
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Keep bundles as artifacts (safety net)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.os }}-${{ strategy.job-index }}
          path: |
            app/src-tauri/target/**/release/bundle/**/*.exe
            app/src-tauri/target/**/release/bundle/**/*.msi
            app/src-tauri/target/**/release/bundle/**/*.dmg
            app/src-tauri/target/**/release/bundle/**/*.AppImage
            app/src-tauri/target/**/release/bundle/**/*.deb
            app/src-tauri/target/**/release/bundle/**/*.app.tar.gz
          if-no-files-found: warn

  android:
    needs: quality-gates
    runs-on: ubuntu-22.04
    continue-on-error: true # beta: Android lane is experimental
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK packages + NDK (SDK is preinstalled on the runner)
        run: |
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Rust + Android targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi
          cargo install tauri-cli --version "^2" --locked
      - name: Init + build Android (release profile, arm64)
        working-directory: app/src-tauri
        run: |
          cargo tauri android init
          # Release profile (optimized + stripped) for the arm64 ABI that
          # every modern Android phone uses. A release build comes out
          # unsigned; the next step signs it so it can be sideloaded.
          # NOTE: the Android shell shows the launcher page — the Python
          # engine cannot spawn on Android, so mobile is a viewer/beta
          # lane exactly like the factory's other experimental APKs.
          # The desktop sidecar (bundle.externalBin) is removed for this
          # target by app/src-tauri/tauri.android.conf.json — without it,
          # tauri-build aborts with: resource path
          # `binaries/optin-engine-aarch64-linux-android` doesn't exist
          # (the v0.5.1–v0.6.0 Android failures).
          # Tee the full log so a failure leaves the real error behind.
          set -o pipefail
          cargo tauri android build --apk --target aarch64 2>&1 | tee /tmp/android-build.log
      - name: Surface the Android build log on failure
        if: failure()
        run: |
          echo "## Android build log (tail)" >> "$GITHUB_STEP_SUMMARY"
          tail -n 150 /tmp/android-build.log >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-build-log
          path: /tmp/android-build.log
          if-no-files-found: ignore
      - name: Sign the APK (ephemeral CI debug key) + give it a real name
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          UNSIGNED=$(find app/src-tauri/gen/android -name "*-release-unsigned.apk" | head -1)
          echo "unsigned APK: $UNSIGNED"
          keytool -genkeypair -keystore /tmp/oim.keystore -storepass android \
            -keypass android -alias oim -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Opt-In Message CI,O=Cyberspace Work,C=BD"
          "$BT/zipalign" -f 4 "$UNSIGNED" /tmp/oim-aligned.apk
          "$BT/apksigner" sign --ks /tmp/oim.keystore --ks-pass pass:android \
            --key-pass pass:android --out optin-message-android.apk /tmp/oim-aligned.apk
          "$BT/apksigner" verify --print-certs optin-message-android.apk | head -3
          ls -la optin-message-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: optin-message-android-apk
          path: optin-message-android.apk
          if-no-files-found: warn
      - name: Attach the APK to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Opt-In Message ${{ github.ref_name }}
          files: optin-message-android.apk
          fail_on_unmatched_files: false
