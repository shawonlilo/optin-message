# Opt-In Message — one-command run.
#
#   docker compose up -d
#   open http://127.0.0.1:8080/  (dashboard at /admin)
#
# The database lives in the named volume below, so it survives
# `docker compose down` and image rebuilds. Remove the volume
# (`docker compose down -v`) only if you really want a clean slate.
#
# Copy .env.example to .env and fill in your own keys, or set the
# variables in your shell — compose passes them through. Everything
# has a safe default: with no keys at all the app still runs, and
# DRY_RUN stays on so nothing real is ever sent.
services:
  optin-message:
    build: .
    image: optin-message
    container_name: optin-message
    ports:
      - "8080:8080"
    environment:
      ADMIN_TOKEN: "${ADMIN_TOKEN:-change-me-dev-token}"
      DRY_RUN: "${DRY_RUN:-1}"
      MAX_RECIPIENTS_PER_CAMPAIGN: "${MAX_RECIPIENTS_PER_CAMPAIGN:-1000}"
      CONSENT_VERSION: "${CONSENT_VERSION:-v1-2026-11-02}"
      # AI Studio (optional) — leave empty to use the local engine.
      META_AI_API_KEY: "${META_AI_API_KEY:-}"
      META_AI_BASE_URL: "${META_AI_BASE_URL:-https://api.meta.ai/v1}"
      META_AI_MODEL: "${META_AI_MODEL:-muse-spark-1.3}"
      # SMS (Twilio) — your own keys.
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID:-}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN:-}"
      TWILIO_FROM: "${TWILIO_FROM:-}"
      # WhatsApp (Meta Cloud API) — your own keys.
      WHATSAPP_TOKEN: "${WHATSAPP_TOKEN:-}"
      WHATSAPP_PHONE_NUMBER_ID: "${WHATSAPP_PHONE_NUMBER_ID:-}"
      # Email (SMTP) — your own keys.
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
    volumes:
      - optin-data:/data
    restart: unless-stopped

volumes:
  optin-data:
